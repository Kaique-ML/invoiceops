[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "invoiceops"
version = "0.1.0"
description = "A document-processing and human-review demonstration for invoices."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "celery[redis]==5.6.3",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "ollama==0.6.3",
    "openpyxl==3.1.5",
    "pillow==11.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "pytesseract==0.3.13",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.1",
    "uvicorn[standard]==0.47.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pytest==9.1.1",
    "reportlab==4.4.10",
    "ruff==0.15.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires real PostgreSQL and Redis services",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
    "openpyxl",
    "openpyxl.*",
    "pypdfium2",
    "pypdfium2.*",
    "pytesseract",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["invoiceops.extraction.documents"]
disable_error_code = ["import-untyped"]
